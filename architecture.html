<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Architecture - Conversational RAG Chatbot</title>
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Geist+Mono&family=Geist:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap");

      :root {
        color-scheme: dark;
        --bg-body: #050505;
        --bg-container: #0a0a0a;
        --node-fill: #171717;
        --node-stroke: #404040;
        --node-text: #f5f5f5;
        --node-sub: #a3a3a3;
        --edge-stroke: #525252;
        --edge-text: #a3a3a3;
        --hover-node-stroke: #a3a3a3;
        --hover-node-fill: #262626;
        --hover-edge: #d4d4d4;
      }

      body {
        margin: 0;
        padding: 2rem;
        font-family:
          "Geist",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
        background-color: var(--bg-body);
        color: var(--node-text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .diagram-container {
        width: 100%;
        max-width: 1200px;
        overflow-x: auto;
        background-color: var(--bg-container);
        border: 1px solid #262626;
        border-radius: 12px;
        padding: 3rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      }

      svg {
        width: 100%;
        min-width: 960px;
        display: block;
      }

      .node rect {
        fill: var(--node-fill);
        stroke: var(--node-stroke);
        stroke-width: 1.5;
        rx: 6;
        transition: all 0.2s ease;
      }
      .node:hover rect {
        stroke: var(--hover-node-stroke);
        fill: var(--hover-node-fill);
      }

      .node text {
        fill: var(--node-text);
        font-size: 10px;
        font-weight: 600;
        transition: all 0.2s ease;
        letter-spacing: 0.02em;
      }
      .node .sub {
        font-family: "Geist Mono", "Consolas", "Courier New", monospace;
        font-size: 7.5px;
        font-weight: normal;
        fill: var(--node-sub);
      }
      .node:hover text {
        fill: #ffffff;
      }
      .node:hover .sub {
        fill: #d4d4d4;
      }

      .edge path {
        fill: none;
        stroke: var(--edge-stroke);
        stroke-width: 1.5;
        transition: all 0.2s ease;
      }
      .edge:hover path {
        stroke: var(--hover-edge);
        stroke-width: 2;
      }

      .edge text {
        font-family: "Geist Mono", "Consolas", "Courier New", monospace;
        font-size: 8px;
        fill: var(--edge-text);
        paint-order: stroke fill;
        stroke: var(--bg-container);
        stroke-width: 8px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .title {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 26px;
        fill: var(--node-text);
      }
      .subtitle {
        font-family: "Geist Mono", "Consolas", "Courier New", monospace;
        font-size: 9px;
        fill: #737373;
      }

      .zone {
        fill: rgba(255, 255, 255, 0.02);
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 1;
        rx: 8;
      }
      .zone-label {
        font-family: "Geist Mono", "Consolas", "Courier New", monospace;
        font-size: 7px;
        fill: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.14em;
      }

      @keyframes flow {
        to {
          stroke-dashoffset: -20;
        }
      }
      .edge path[stroke-dasharray] {
        animation: flow 1.5s linear infinite;
        stroke: var(--node-sub);
      }
    </style>
  </head>
  <body>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
        <title id="title">Conversational RAG Chatbot Architecture</title>
        <desc id="desc">
          Data Ingestion (Offline) and Conversational Retrieval (Online)
          workflows
        </desc>

        <defs>
          <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path
              d="M 0 0 L 10 5 L 0 10 z"
              fill="#525252"
              style="fill: context-stroke"
            />
          </marker>
        </defs>

        <text x="40" y="60" class="title">Conversational RAG Chatbot</text>
        <text x="40" y="80" class="subtitle">
          LangChain + ChromaDB + Groq LLM
        </text>

        <!-- Zones -->
        <rect x="40" y="120" width="880" height="200" class="zone" />
        <text x="50" y="135" class="zone-label">DATA INGESTION (OFFLINE)</text>

        <rect x="40" y="340" width="880" height="240" class="zone" />
        <text x="50" y="355" class="zone-label">
          CONVERSATIONAL RETRIEVAL (ONLINE)
        </text>

        <!-- Nodes: Offline -->
        <g class="node" transform="translate(60, 180)">
          <rect x="0" y="0" width="140" height="60" />
          <text x="70" y="25" text-anchor="middle">PDF Document</text>
          <text x="70" y="40" class="sub" text-anchor="middle">Raw Data</text>
        </g>
        <g class="node" transform="translate(260, 180)">
          <rect x="0" y="0" width="140" height="60" />
          <text x="70" y="25" text-anchor="middle">PyPDFLoader</text>
          <text x="70" y="40" class="sub" text-anchor="middle">
            Text Extraction
          </text>
        </g>
        <g class="node" transform="translate(460, 180)">
          <rect x="0" y="0" width="160" height="60" />
          <text x="80" y="25" text-anchor="middle">Recursive Splitter</text>
          <text x="80" y="40" class="sub" text-anchor="middle">
            Text Chunks
          </text>
        </g>
        <g class="node" transform="translate(680, 180)">
          <rect x="0" y="0" width="180" height="60" />
          <text x="90" y="25" text-anchor="middle">ChromaDB</text>
          <text x="90" y="40" class="sub" text-anchor="middle">
            Vector Store
          </text>
        </g>

        <!-- Nodes: Online -->
        <g class="node" transform="translate(60, 420)">
          <rect x="0" y="0" width="140" height="60" />
          <text x="70" y="25" text-anchor="middle">User Query</text>
          <text x="70" y="40" class="sub" text-anchor="middle">
            Streamlit UI
          </text>
        </g>
        <g class="node" transform="translate(260, 420)">
          <rect x="0" y="0" width="140" height="60" />
          <text x="70" y="25" text-anchor="middle">HF Embeddings</text>
          <text x="70" y="40" class="sub" text-anchor="middle">
            Query Vectorization
          </text>
        </g>
        <g class="node" transform="translate(460, 420)">
          <rect x="0" y="0" width="160" height="60" />
          <text x="80" y="25" text-anchor="middle">Prompt Template</text>
          <text x="80" y="40" class="sub" text-anchor="middle">
            Context + Chat History
          </text>
        </g>
        <g class="node" transform="translate(680, 420)">
          <rect x="0" y="0" width="180" height="60" />
          <text x="90" y="25" text-anchor="middle">Groq (gpt-oss-20b)</text>
          <text x="90" y="40" class="sub" text-anchor="middle">
            LLM Inference
          </text>
        </g>

        <!-- Edges -->
        <g class="edge">
          <!-- Offline -->
          <path d="M 200 210 L 260 210" marker-end="url(#arrow)" />
          <path d="M 400 210 L 460 210" marker-end="url(#arrow)" />
          <path d="M 620 210 L 680 210" marker-end="url(#arrow)" />

          <!-- Online -->
          <path d="M 200 450 L 260 450" marker-end="url(#arrow)" />
          <path d="M 400 450 L 460 450" marker-end="url(#arrow)" />
          <path d="M 620 450 L 680 450" marker-end="url(#arrow)" />

          <!-- Cross-zone connection from HF Embeddings to ChromaDB -->
          <path
            d="M 330 420 L 330 310 L 770 310 L 770 240"
            marker-end="url(#arrow)"
            stroke-dasharray="4,3"
          />

          <!-- Cross-zone connection from ChromaDB to Prompt Template -->
          <path
            d="M 770 240 L 770 320 L 540 320 L 540 420"
            marker-end="url(#arrow)"
            stroke-dasharray="4,3"
          />
        </g>
      </svg>
    </div>
  </body>
</html>
